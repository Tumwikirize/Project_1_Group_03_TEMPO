<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">FIG-50 Analytics data flow</title>
  <desc id="desc">Data flow through the analytics components. The user interface sends a report request to the Analytics Service (C-50). C-50 receives time records from the Time Entry Repository (C-05) and goals and status periods from the Goal Manager (C-30). It passes the records and range to the Period Calculator (C-51), which produces daily totals for the Progress (C-52), Statistics (C-53), and Projection (C-54) calculators. C-50 passes goals and status periods to C-52, and C-52 passes period statuses to C-53. The three calculators send their results to the Chart and Summary Builder (C-55), which returns the report data to C-50. C-50 stores reports in and reads them from the report cache (D3) and returns the report to the user interface. The Change Listener (C-56) receives record and goal change events and tells C-50 which activity is affected; C-50 then invalidates the cache and sends a refresh notice to the user interface.</desc>
