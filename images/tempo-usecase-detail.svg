    <tspan x="389" dy="20">a goal</tspan>
  </text>
  <line x1="1125" y1="246" x2="996" y2="105" stroke="#65778f" stroke-width="2" />
  <ellipse cx="852" cy="105" rx="144" ry="29" fill="#f3f7fc" stroke="#2c5d95" stroke-width="2.2" />
  <text x="852" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#24364e">Add time record</text>
  <line x1="1125" y1="246" x2="996" y2="202" stroke="#65778f" stroke-width="2" />
  <ellipse cx="852" cy="202" rx="144" ry="29" fill="#f3f7fc" stroke="#2c5d95" stroke-width="2.2" />
  <text x="852" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#24364e">
    <tspan x="852" dy="0">Edit or delete</tspan>
    <tspan x="852" dy="20">time record</tspan>
  </text>
  <line x1="1125" y1="246" x2="996" y2="299" stroke="#65778f" stroke-width="2" />
  <ellipse cx="852" cy="299" rx="144" ry="29" fill="#f3f7fc" stroke="#2c5d95" stroke-width="2.2" />
  <text x="852" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#24364e">
    <tspan x="852" dy="0">Review recorded</tspan>
    <tspan x="852" dy="20">history</tspan>
  </text>
  <line x1="1125" y1="246" x2="996" y2="396" stroke="#65778f" stroke-width="2" />
  <ellipse cx="852" cy="396" rx="144" ry="29" fill="#f3f7fc" stroke="#2c5d95" stroke-width="2.2" />
  <text x="852" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#24364e">
    <tspan x="852" dy="0">Compare progress</tspan>
    <tspan x="852" dy="20">with target</tspan>
  </text>
  <line x1="1125" y1="246" x2="996" y2="493" stroke="#65778f" stroke-width="2" />
  <ellipse cx="852" cy="493" rx="144" ry="29" fill="#f3f7fc" stroke="#2c5d95" stroke-width="2.2" />
  <text x="852" y="489" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#24364e">
    <tspan x="852" dy="0">View trends, averages,</tspan>
    <tspan x="852" dy="20">and projection</tspan>
  </text>
