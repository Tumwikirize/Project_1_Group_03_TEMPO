<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="800" viewBox="0 0 1290 800" role="img" aria-labelledby="title desc">
  <title id="title">FIG-51 Analytics report data model</title>
  <desc id="desc">UML class diagram of the report objects produced by the analytics components. A ReportRequest for one or more activities produces a ProgressReport. A ProgressReport is composed of one or more PeriodSummary objects, one Statistics object, an optional Projection, and one ChartSeries. Each PeriodSummary covers one ReportingPeriod and has a PeriodStatus. Time records from the logging design are grouped into reporting periods. The Goal and StatusPeriod classes from the goals design (C-30) supply the target in effect and any suspended or archived days for each period. A separate DashboardSummary holds the cross-activity totals and goal counts shown on the dashboard.</desc>
