<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" role="img" aria-labelledby="title desc">
  <title id="title">FIG-52 Generate a progress report</title>
  <desc id="desc">UML sequence diagram. The user opens a report. The user interface calls getReport on the Analytics Service (C-50), which checks the report cache. On a cache hit the cached report is returned. Otherwise C-50 asks the Period Calculator (C-51) for reporting periods, retrieves time records from the Time Entry Repository (C-05) and goals and status periods from the Goal Manager, has C-51 group records into daily totals, asks the calculators (C-52 to C-54) for period summaries, statistics, and the projection, asks the Chart and Summary Builder (C-55) for chart series and a written summary, stores the report in the cache, and returns it to the user interface, which displays it.</desc>
